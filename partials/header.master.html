<header>
  <div class="container nav">
    <a class="brand" href="{{ROOT}}index.html#accueil">
      <div class="logo-container">
        <img src="{{ROOT}}cfa.jpeg" alt="CFA Logo">
      </div>
      <div><span style="font-size: 1.12em; font-weight: bold; text-transform: none !important;">Collins French Academy</span><small></small></div>
    </a>
    <div class="nav-right">
<button id="hamburger-menu-trigger"
        class="cfa-mobile-menu-button"
        type="button"
        aria-label="Ouvrir le menu"
        aria-expanded="false">
  <span></span>
  <span></span>
  <span></span>
</button>

      <nav>
        <a href="{{ROOT}}index.html#accueil">Accueil</a>
        <a href="{{ROOT}}index.html#cours">Cours</a>
        <a href="{{ROOT}}index.html#ressources">Ressources</a>
        <a href="{{ROOT}}pages/apropos.html">À propos</a>
      </nav>
      <div class="account-links" id="accountArea">
  <a class="cfa-connexion-link" href="{{ROOT}}pages/connexion.html">Connexion</a>
</div>
      <button class="theme-toggle" id="themeToggle" aria-label="Changer de thème">Mode sombre </button>

    </div>
  </div>

<!-- CFA MOBILE MENU -->
<div id="site-mobile-drawer" aria-hidden="true">

    <div class="cfa-mobile-header">
        <strong>CFA</strong>

        <button
            type="button"
            id="close-drawer-btn"
            aria-label="Fermer le menu">
            ×
        </button>
    </div>

    <nav class="cfa-mobile-nav">
        <a class="cfa-mobile-link" href="{{ROOT}}index.html#accueil">Accueil</a>
        <a class="cfa-mobile-link" href="{{ROOT}}index.html#cours">Cours</a>
        <a class="cfa-mobile-link" href="{{ROOT}}index.html#ressources">Ressources</a>
        <a class="cfa-mobile-link" href="{{ROOT}}pages/apropos.html">À propos</a>
        <a class="cfa-mobile-login" id="mobileLearnerEntry" href="{{ROOT}}pages/connexion.html">Connexion</a>
        <button type="button" id="drawer-theme-toggle" class="cfa-mobile-theme">Mode sombre</button>
    </nav>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const trigger =
        document.getElementById("hamburger-menu-trigger");

    const drawer =
        document.getElementById("site-mobile-drawer");

    const closeBtn =
        document.getElementById("close-drawer-btn");

    const drawerTheme =
        document.getElementById("drawer-theme-toggle");

    const html =
        document.documentElement;

    console.log("CFA mobile menu initialized:", {
        trigger: !!trigger,
        drawer: !!drawer,
        closeBtn: !!closeBtn
    });

    if (!trigger || !drawer) {
        console.error("CFA mobile menu elements missing.");
        return;
    }

    function updateThemeButton() {

        const dark =
            html.getAttribute("data-theme") === "dark";

        if (drawerTheme) {

            drawerTheme.textContent =
                dark
                    ? "️ Mode clair"
                    : "Mode sombre ";
        }
    }

    function openMenu() {

        console.log("CFA: opening mobile menu");

        drawer.classList.add("cfa-open");

        drawer.setAttribute(
            "aria-hidden",
            "false"
        );

        trigger.setAttribute(
            "aria-expanded",
            "true"
        );

        document.body.classList.add(
            "cfa-drawer-open"
        );

        document.body.style.overflow = "hidden";

        updateThemeButton();
    }

    function closeMenu() {

        console.log("CFA: closing mobile menu");

        drawer.classList.remove("cfa-open");

        drawer.setAttribute(
            "aria-hidden",
            "true"
        );

        trigger.setAttribute(
            "aria-expanded",
            "false"
        );

        document.body.classList.remove(
            "cfa-drawer-open"
        );

        document.body.style.overflow = "";
    }

    /* =====================================================
       HAMBURGER
       ===================================================== */

    trigger.addEventListener(
        "click",
        function (event) {

            event.preventDefault();
            event.stopPropagation();

            if (
                drawer.classList.contains(
                    "cfa-open"
                )
            ) {
                closeMenu();
            } else {
                openMenu();
            }
        },
        false
    );

    /* =====================================================
       CLOSE BUTTON
       ===================================================== */

    if (closeBtn) {

        closeBtn.addEventListener(
            "click",
            function (event) {

                event.preventDefault();
                event.stopPropagation();

                closeMenu();
            },
            false
        );
    }

    /* =====================================================
       THEME
       ===================================================== */

    if (drawerTheme) {

        drawerTheme.addEventListener(
            "click",
            function () {

                const current =
                    html.getAttribute(
                        "data-theme"
                    ) || "light";

                const next =
                    current === "dark"
                        ? "light"
                        : "dark";

                html.setAttribute(
                    "data-theme",
                    next
                );

                localStorage.setItem(
                    "cfa_theme",
                    next
                );

                const desktopTheme =
                    document.getElementById(
                        "themeToggle"
                    );

                if (desktopTheme) {

                    desktopTheme.textContent =
                        next === "dark"
                            ? "Mode clair"
                            : "Mode sombre";
                }

                updateThemeButton();
            },
            false
        );
    }

    /* =====================================================
       CLOSE AFTER NAVIGATION
       ===================================================== */

    drawer
        .querySelectorAll(
            "a.cfa-mobile-link"
        )
        .forEach(function (link) {

            link.addEventListener(
                "click",
                function () {
                    closeMenu();
                }
            );
        });

});
</script>

</header>
