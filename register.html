<!-- CFA MOBILE MENU -->
<div id="site-mobile-drawer" aria-hidden="true">

    <div class="cfa-mobile-header">
        <strong>CFA</strong>

        <button
            type="button"
            id="close-drawer-btn"
            aria-label="Fermer le menu">
            ×
        </button>
    </div>

    <nav class="cfa-mobile-nav">
        <a class="cfa-mobile-link" href="index.html#accueil">Accueil</a>
        <a class="cfa-mobile-link" href="index.html#cours">Cours</a>

        <a class="cfa-mobile-login" id="mobileLearnerEntry" href="pages/connexion.html">Connexion</a>
        <button type="button" id="drawer-theme-toggle" class="cfa-mobile-theme">Mode sombre</button>
    </nav>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const trigger =
        document.getElementById("hamburger-menu-trigger");

    const drawer =
        document.getElementById("site-mobile-drawer");

    const closeBtn =
        document.getElementById("close-drawer-btn");

    const drawerTheme =
        document.getElementById("drawer-theme-toggle");

    const html =
        document.documentElement;

    console.log("CFA mobile menu initialized:", {
        trigger: !!trigger,
        drawer: !!drawer,
        closeBtn: !!closeBtn
    });

    if (!trigger || !drawer) {
        console.error("CFA mobile menu elements missing.");
        return;
    }

    function updateThemeButton() {

        const dark =
            html.getAttribute("data-theme") === "dark";

        if (drawerTheme) {

            drawerTheme.textContent =
                dark
                    ? "️ Mode clair"
                    : "Mode sombre ";
        }
    }

    function openMenu() {

        console.log("CFA: opening mobile menu");

        drawer.classList.add("cfa-open");

        drawer.setAttribute(
            "aria-hidden",
            "false"
        );

        trigger.setAttribute(
            "aria-expanded",
            "true"
        );

        document.body.classList.add(
            "cfa-drawer-open"
        );

        document.body.style.overflow = "hidden";

        updateThemeButton();
    }

    function closeMenu() {

        console.log("CFA: closing mobile menu");

        drawer.classList.remove("cfa-open");

        drawer.setAttribute(
            "aria-hidden",
            "true"
        );

        trigger.setAttribute(
            "aria-expanded",
            "false"
        );

        document.body.classList.remove(
            "cfa-drawer-open"
        );

        document.body.style.overflow = "";
    }

    /* =====================================================
       HAMBURGER
       ===================================================== */

    trigger.addEventListener(
        "click",
        function (event) {

            event.preventDefault();
            event.stopPropagation();

            if (
                drawer.classList.contains(
                    "cfa-open"
                )
            ) {
                closeMenu();
            } else {
                openMenu();
            }
        },
        false
    );

    /* =====================================================
       CLOSE BUTTON
       ===================================================== */

    if (closeBtn) {

        closeBtn.addEventListener(
            "click",
            function (event) {

                event.preventDefault();
                event.stopPropagation();

                closeMenu();
            },
            false
        );
    }

    /* =====================================================
       THEME
       ===================================================== */

    if (drawerTheme) {

        drawerTheme.addEventListener(
            "click",
            function () {

                const current =
                    html.getAttribute(
                        "data-theme"
                    ) || "light";

                const next =
                    current === "dark"
                        ? "light"
                        : "dark";

                html.setAttribute(
                    "data-theme",
                    next
                );

                localStorage.setItem(
                    "cfa_theme",
                    next
                );

                const desktopTheme =
                    document.getElementById(
                        "themeToggle"
                    );

                if (desktopTheme) {

                    desktopTheme.textContent =
                        next === "dark"
                            ? "Mode clair"
                            : "Mode sombre";
                }

                updateThemeButton();
            },
            false
        );
    }

    /* =====================================================
       CLOSE AFTER NAVIGATION
       ===================================================== */

    drawer
        .querySelectorAll(
            "a.cfa-mobile-link"
        )
        .forEach(function (link) {

            link.addEventListener(
                "click",
                function () {
                    closeMenu();
                }
            );
        });

});
</script>
