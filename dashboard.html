<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Collins French Academy</title>
<style>
:root{--blue:#174ea6;--ink:#10203a;--muted:#64748b;--paper:#f6f9fc;--white:#fff;--line:#e5eaf2;--shadow:0 20px 40px -15px rgba(15,35,70,.12);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh;padding:40px;}
.container{max-width:900px;margin:0 auto;}
header{display:flex;justify-content:space-between;align-items:center;background:var(--white);padding:20px 30px;border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:30px;}
h1{font-size:22px;color:var(--blue);}
.logout-btn{color:#d93025;text-decoration:none;font-weight:600;font-size:14px;cursor:pointer;}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:var(--shadow);margin-bottom:20px;}
h2{font-size:18px;margin-bottom:15px;color:var(--ink);}
.form-group{margin-bottom:15px;}
label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;}
input, select, textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--paper);color:var(--ink);}
textarea{resize:vertical;height:100px;}
.btn{background:var(--blue);color:white;padding:10px 20px;border:none;border-radius:8px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<script>
// Check authentication immediately before rendering body content to prevent flash loops
if(sessionStorage.getItem('cfa_logged_in') !== 'true') {
  window.location.replace('login.html');
}
</script>
<div class="container">
  <header>
    <div>
      <h1>Centre de Création CFA</h1>
      <p id="welcomeUser" style="color:var(--muted);font-size:13px;margin-top:4px;">Bienvenue sur votre tableau de bord.</p>
    </div>
    <a class="logout-btn" onclick="logout()">Déconnexion</a>
  



<div class="mobile-menu-icon-container" style="display: none; padding: 10px 20px 0 20px; background: inherit;">
    <button id="hamburger-menu-trigger" style="background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 5px; display: flex; flex-direction: column; gap: 5px;">
        <span style="display: block; width: 24px; height: 2px; background-color: white;"></span>
        <span style="display: block; width: 24px; height: 2px; background-color: white;"></span>
        <span style="display: block; width: 24px; height: 2px; background-color: white;"></span>
    </button>
</div>
<style>
@media (max-width: 768px) {
    .mobile-menu-icon-container { display: block !important; }
}
</style>


<!-- Mobile Navigation Drawer & 3-line Menu Integration -->
<div class="mobile-menu-icon-container" style="display: none; padding: 10px 20px 0 20px; background: inherit;">
    <button id="hamburger-menu-trigger" style="background: none; border: none; color: white; cursor: pointer; padding: 5px; display: flex; flex-direction: column; gap: 5px;">
        <span style="display: block; width: 24px; height: 2px; background-color: white;"></span>
        <span style="display: block; width: 24px; height: 2px; background-color: white;"></span>
        <span style="display: block; width: 24px; height: 2px; background-color: white;"></span>
    </button>
</div>

<div id="site-mobile-drawer" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); z-index: 99999; flex-direction: column; padding: 30px; box-sizing: border-box; color: #fff; font-family: inherit;">
    <div style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
        <button id="close-drawer-btn" style="background: none; border: none; color: #fff; font-size: 32px; cursor: pointer;">&times;</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 18px; max-width: 320px; width: 100%; margin: 0 auto;">
        <div id="drawer-theme-toggle" style="cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 17px;">☀️ Mode clair / sombre</div>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin: 5px 0;">
        <a href="index.html" style="color: inherit; text-decoration: none; font-size: 17px;">Accueil</a>
        <a href="index.html#cours" style="color: inherit; text-decoration: none; font-size: 17px;">Cours</a>
        <a href="pages/apropos.html" style="color: inherit; text-decoration: none; font-size: 17px;">À propos</a>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin: 5px 0;">
        <a href="pages/connexion.html" style="background: #2563eb; color: white; padding: 12px; border-radius: 8px; text-align: center; text-decoration: none; font-weight: 600; display: block; font-size: 17px;">Connexion</a>
    </div>
</div>

<style>
@media (max-width: 768px) {
    .mobile-menu-icon-container { display: block !important; }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const trigger = document.getElementById("hamburger-menu-trigger");
    const drawer = document.getElementById("site-mobile-drawer");
    const closeBtn = document.getElementById("close-drawer-btn");
    
    if (trigger && drawer) {
        trigger.addEventListener("click", () => {
            drawer.style.display = "flex";
        });
    }
    if (closeBtn && drawer) {
        closeBtn.addEventListener("click", () => {
            drawer.style.display = "none";
        });
    }
});
</script>

</header>

  <div class="card">
    <h2>Ajouter une nouvelle leçon</h2>
    <form onsubmit="addLesson(event)">
      <div class="form-group">
        <label>Titre</label>
        <input type="text" id="lessonTitle" placeholder="Ex: Les pronoms" required>
      </div>
      <div class="form-group">
        <label>Niveau</label>
        <select id="lessonLevel">
          <option value="A1">A1</option>
          <option value="A2">A2</option>
          <option value="B1">B1</option>
          <option value="B2">B2</option>
        </select>
      </div>
      <div class="form-group">
        <label>Contenu</label>
        <textarea id="lessonContent" placeholder="Description de la leçon..." required></textarea>
      </div>
      <button type="submit" class="btn">Publier la leçon</button>
    </form>
  </div>
</div>

<script>
const user = sessionStorage.getItem('cfa_user');
if(user) {
  document.getElementById('welcomeUser').innerText = `Connecté en tant que : ${user}`;
}

function logout() {
  sessionStorage.removeItem('cfa_logged_in');
  sessionStorage.removeItem('cfa_user');
  window.location.replace('login.html');
}

function addLesson(e) {
  e.preventDefault();
  alert('Leçon ajoutée avec succès !');
  e.target.reset();
}
</script>

<script>
    // Global Dark Mode Synchronizer
    document.addEventListener("DOMContentLoaded", () => {
        const isDarkMode = localStorage.getItem("darkMode") === "true";
        if (isDarkMode) {
            document.body.classList.add("dark-mode");
        }
        
        // Listen for any theme toggle buttons across pages
        const toggles = document.querySelectorAll("#darkModeToggle, .dark-mode-toggle, [onclick*=\x27dark\x27]");
        toggles.forEach(toggle => {
            toggle.addEventListener("click", () => {
                document.body.classList.toggle("dark-mode");
                localStorage.setItem("darkMode", document.body.classList.contains("dark-mode"));
            });
        });
    });
</script>
<div style="text-align: center; margin-top: 20px; font-size: 0.9rem; opacity: 0.8;">Apprendre • S'amuser • S'inspirer • Découvrir</div>

<!-- Mobile Navigation Drawer -->
<div id="mobile-menu-drawer" style="background: #090d16 !important; background-color: #090d16 !important; opacity: 1 !important; z-index: 2147483647 !important;" style="display: none; position: fixed; top: 0; right: 0; width: 280px; height: 100%; background: #0f172a; z-index: 9999; box-shadow: -4px 0 20px rgba(0,0,0,0.5); flex-direction: column; padding: 25px; box-sizing: border-box; color: #fff; font-family: inherit;">
    <div style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
        <button id="close-menu-btn" style="background: none; border: none; color: #fff; font-size: 24px; cursor: pointer;">&times;</button>
    </div>
    <div id="theme-toggle-btn" style="cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 16px; margin-bottom: 15px;">☀️ Mode clair / sombre</div>
    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin: 5px 0 15px 0;">
    <a href="index.html" style="color: inherit; text-decoration: none; font-size: 16px; margin-bottom: 15px; display: block;">Accueil</a>
    <a href="index.html#cours" style="color: inherit; text-decoration: none; font-size: 16px; margin-bottom: 15px; display: block;">Cours</a>
    <a href="pages/apropos.html" style="color: inherit; text-decoration: none; font-size: 16px; margin-bottom: 20px; display: block;">À propos</a>
    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin: 0 0 20px 0;">
    <a href="pages/connexion.html" style="background: #2563eb; color: white; padding: 12px; border-radius: 8px; text-align: center; text-decoration: none; font-weight: 600; display: block;">Connexion</a>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const hamburger = document.querySelector(".menu-toggle, .hamburger, header .fa-bars, button svg, [class*="menu"], [class*="toggle"], header button:last-child");
    const drawer = document.getElementById("mobile-menu-drawer");
    const closeBtn = document.getElementById("close-menu-btn");
    
    if (hamburger && drawer) {
        hamburger.style.cursor = "pointer";
        hamburger.addEventListener("click", (e) => {
            e.stopPropagation();
            drawer.style.display = "flex";
        });
    }
    if (closeBtn && drawer) {
        closeBtn.addEventListener("click", () => {
            drawer.style.display = "none";
        });
    }
    window.addEventListener("click", (e) => {
        if (drawer && drawer.style.display === "flex" && !drawer.contains(e.target) && !hamburger.contains(e.target)) {
            drawer.style.display = "none";
        }
    });
});
</script>

</body>
</html>
