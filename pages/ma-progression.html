<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ma progression — Collins French Academy</title>

<link rel="stylesheet" href="../css/cfa-shared-theme.css">
<script src="../js/cfa-shared-theme.js"></script>

<link rel="stylesheet" href="../css/cfa-loader.css" data-cfa-loader="css">
<script src="../js/cfa-loader.js" defer data-cfa-loader="js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.6;
}

.container{
    width:min(1160px,92%);
    margin:auto;
}

header{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--white);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(16px);
}

.nav{
    min-height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    color:inherit;
    text-decoration:none;
    font-weight:700;
}

.brand img{
    width:48px;
    height:48px;
    object-fit:contain;
}

.brand-name{
    font-size:20px;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:22px;
}

.nav-links a{
    color:inherit;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
}

.page{
    padding:70px 0 90px;
}

.hero{
    text-align:center;
    max-width:760px;
    margin:0 auto 38px;
}

.hero h1{
    margin:0 0 10px;
    font-size:38px;
}

.hero p{
    margin:0;
    color:var(--muted);
}

.progress-box{
    max-width:900px;
    margin:auto;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:18px;
    padding:32px;
}

.progress-title{
    margin:0;
    font-size:22px;
}

.progress{
    height:14px;
    background:#edf0f5;
    border-radius:20px;
    overflow:hidden;
    margin-top:20px;
}

.progress span{
    display:block;
    width:0%;
    height:100%;
    background:var(--orange);
    transition:width .4s ease;
}

.progress-text{
    margin:16px 0 0;
    color:var(--muted);
}

.progress-text strong{
    color:var(--ink);
}

footer{
    padding:42px 0 36px;
    background:var(--white);
    border-top:1px solid var(--line);
}

.footer{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.footer-tagline{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
}

.footer-copyright{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
    min-width:260px;
    font-size:11px;
    color:var(--muted);
}

@media(max-width:768px){

    .nav-links{
        display:none;
    }

    .page{
        padding-top:45px;
    }

    .hero h1{
        font-size:30px;
    }

    .progress-box{
        padding:24px;
    }
}
</style>
</head>

<body>

<header>
    <div class="container nav">

        <a class="brand" href="espace-etudiant.html">
            <img src="../file.png" alt="CFA Logo">
            <span class="brand-name">Collins French Academy</span>
        </a>

        <nav class="nav-links">
            <a href="espace-etudiant.html">Espace Apprenant</a>
            <a href="../index.html">Accueil</a>
        </nav>

    </div>
</header>

<main class="page">

    <div class="container">

        <section class="hero">
            <h1>📊 Ma progression</h1>
            <p>Suivez votre évolution dans votre parcours CFA.</p>
        </section>

        <section class="progress-box">

            <h2 class="progress-title">
                Votre parcours CFA
            </h2>

            <div
                class="progress"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
            >
                <span id="progressBar"></span>
            </div>

            <p id="progressText" class="progress-text">
                <strong id="progressPercent">0.00%</strong>
                — Votre aventure commence maintenant.
            </p>

        </section>

    </div>

</main>

<footer>
    <div class="container footer">
        <div class="footer-tagline">
            Apprendre · S’amuser · S’inspirer · Découvrir
        </div>
        <div class="footer-copyright">
            © 2026 Collins French Academy (CFA)
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>

<script type="module">

const {
    data: {
        session
    }
} = await cfaSupabase.auth.getSession();

if (!session) {

    window.location.href =
        "connexion.html";

} else {

    const user = session.user;

    const progressBar =
        document.getElementById("progressBar");

    const progressPercent =
        document.getElementById("progressPercent");

    const progressText =
        document.getElementById("progressText");

    let progressValue = 0;

    const {
        data: progressData,
        error: progressError
    } = await cfaSupabase
        .from("learner_progress")
        .select("progress_percentage")
        .eq("user_id", user.id)
        .maybeSingle();

    if (!progressError && progressData) {

        progressValue =
            Number(progressData.progress_percentage) || 0;

    } else if (!progressError && !progressData) {

        const {
            error: createProgressError
        } = await cfaSupabase
            .from("learner_progress")
            .insert({
                user_id: user.id,
                progress_percentage: 0
            });

        if (createProgressError) {

            console.warn(
                "Unable to initialize learner progress:",
                createProgressError
            );

        }

        progressValue = 0;
    }

    progressValue =
        Math.max(0, Math.min(100, progressValue));

    if (progressBar) {

        progressBar.style.width =
            progressValue + "%";

        progressBar.setAttribute(
            "aria-valuenow",
            progressValue.toFixed(2)
        );

    }

    if (progressPercent) {

        progressPercent.textContent =
            progressValue.toFixed(2) + "%";

    }

    if (progressText) {

        if (progressValue === 0) {

            progressText.innerHTML =
                '<strong id="progressPercent">' +
                progressValue.toFixed(2) +
                '%</strong> — Votre aventure commence maintenant.';

        } else if (progressValue >= 100) {

            progressText.innerHTML =
                '<strong id="progressPercent">' +
                progressValue.toFixed(2) +
                '%</strong> — Félicitations ! Votre parcours CFA est terminé.';

        } else {

            progressText.innerHTML =
                '<strong id="progressPercent">' +
                progressValue.toFixed(2) +
                '%</strong> — Vous avez complété votre parcours CFA.';

        }

    }

}

</script>

</body>
</html>
