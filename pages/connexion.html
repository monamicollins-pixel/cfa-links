<script>
document.addEventListener("DOMContentLoaded", () => {
    const trigger = document.getElementById("hamburger-menu-trigger");
    const drawer = document.getElementById("site-mobile-drawer");
    const closeBtn = document.getElementById("close-drawer-btn");
    
    if (trigger && drawer) {

            drawer.style.display = "none";

});
</script>

<script>
/* =========================================================
   CFA — PREVENT MULTIPLE LOGIN
   Already authenticated learners go directly to their space.
   ========================================================= */

document.addEventListener("DOMContentLoaded", async function () {

    try {

        const params = new URLSearchParams(window.location.search);
        const verification = params.get("verification");

        const {
            data: { user }
        } = await cfaSupabase.auth.getUser();

        /*
         * CFA — Email verification success experience
         */
        if (user && verification === "success") {

            const message = document.getElementById("authMessage");

            const firstName =
                user.user_metadata?.first_name ||
                "Apprenant";

            if (message) {

                message.className =
                    "auth-message success";

                message.innerHTML =
                    '<div style="font-size:42px; margin-bottom:10px;">✓</div>' +
                    '<strong style="font-size:20px;">Adresse e-mail confirmée</strong>' +
                    '<div style="margin-top:8px;">Bienvenue dans votre Espace Apprenant, ' +
                    firstName +
                    '.</div>' +
                    '<div style="margin-top:6px; opacity:.85;">' +
                    'Votre compte CFA est maintenant activé.' +
                    '</div>';
            }

            setTimeout(function () {
                window.location.replace("../dashboard.html");
            }, 1800);

            return;
        }

        /*
         * CFA — Existing authenticated learner
         */
        if (user) {
            window.location.replace("../dashboard.html");
        }

    } catch (error) {

        console.error(
            "CFA existing-session check failed:",
            error
        );
    }
});
</script>

<script>
    // Global Dark Mode Synchronizer
    document.addEventListener("DOMContentLoaded", () => {
        const isDarkMode = localStorage.getItem("darkMode") === "true";
        if (isDarkMode) {
            document.body.classList.add("dark-mode");
        }
        
        // Listen for any theme toggle buttons across pages
        const toggles = document.querySelectorAll("#darkModeToggle, .dark-mode-toggle, [onclick*=\x27dark\x27]");
        toggles.forEach(toggle => {
            toggle.addEventListener("click", () => {
                document.body.classList.toggle("dark-mode");
                localStorage.setItem("darkMode", document.body.classList.contains("dark-mode"));
            });
        });
    });
</script>

<script>
    // Universal Dark Mode Handler
    (function() {
        const currentTheme = localStorage.getItem("theme");
        if (currentTheme === "dark" || localStorage.getItem("darkMode") === "true") {
            document.body.classList.add("dark-mode");
        }
        
        // Also sync any dark mode toggle click handlers across pages
        window.addEventListener("load", () => {
            const toggleBtn = document.querySelector("#darkModeToggle, .sun-icon, [onclick*=\x27dark\x27], .dark-toggle");
            if (toggleBtn) {
                toggleBtn.addEventListener("click", () => {
                    document.body.classList.toggle("dark-mode");
                    let isDark = document.body.classList.contains("dark-mode");
                    localStorage.setItem("theme", isDark ? "dark" : "light");
                    localStorage.setItem("darkMode", isDark);
                });
            }
        });
    })();
</script>
