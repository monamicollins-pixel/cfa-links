<script>
document.addEventListener("DOMContentLoaded", function () {

    const firstName = document.getElementById("firstName");
    const lastName = document.getElementById("lastName");
    const form = document.getElementById("signupForm");

    /*
     * Allowed:
     * Letters, French accents, spaces, hyphens and apostrophes.
     */
    const invalidCharacters = /[^\p{L}\s'’-]/gu;

    function normalizeName(value) {

        // Remove invalid characters
        value = value.replace(invalidCharacters, "");

        // Normalize repeated spaces
        value = value.replace(/\s+/g, " ");

        // Normalize repeated hyphens
        value = value.replace(/-{2,}/g, "-");

        // Normalize repeated apostrophes
        value = value.replace(/['’]{2,}/g, "'");

        // Trim
        value = value.trim();

        // Capitalize every word
        value = value
            .toLowerCase()
            .replace(/(^|[\s'’-])\p{L}/gu, function(match) {
                return match.toUpperCase();
            });

        return value;
    }

    function validateName(value) {

        /*
         * Must contain letters.
         * Spaces, apostrophes and hyphens are allowed
         * only between letters.
         */
        return /^[\p{L}]+(?:[\s'’-][\p{L}]+)*$/u.test(value);
    }

    function setupNameField(field) {

        if (!field) return;

        field.addEventListener("input", function () {

            const cursorPosition = field.selectionStart;

            field.value = normalizeName(field.value);

            field.setSelectionRange(
                Math.min(cursorPosition, field.value.length),
                Math.min(cursorPosition, field.value.length)
            );

            field.setCustomValidity("");

        });

        field.addEventListener("blur", function () {

            field.value = normalizeName(field.value);

            if (field.value && !validateName(field.value)) {

                field.setCustomValidity(
                    "Veuillez utiliser uniquement des lettres, espaces, apostrophes ou tirets."
                );

            } else {

                field.setCustomValidity("");

            }

        });

    }

    setupNameField(firstName);
    setupNameField(lastName);

    if (form) {

        form.addEventListener("submit", function (event) {

            firstName.value = normalizeName(firstName.value);
            lastName.value = normalizeName(lastName.value);

            if (!validateName(firstName.value)) {

                firstName.setCustomValidity(
                    "Prénom invalide. Utilisez uniquement des lettres."
                );

                firstName.reportValidity();

                event.preventDefault();
                return;

            }

            if (!validateName(lastName.value)) {

                lastName.setCustomValidity(
                    "Nom invalide. Utilisez uniquement des lettres."
                );

                lastName.reportValidity();

                event.preventDefault();
                return;

            }

            /*
             * auth.js expects a single "name" field.
             * Create it automatically from Prénom + Nom.
             */
            let nameField = document.getElementById("name");

            if (!nameField) {

                nameField = document.createElement("input");
                nameField.type = "hidden";
                nameField.id = "name";
                nameField.name = "name";

                form.appendChild(nameField);

            }

            nameField.value =
                firstName.value + " " + lastName.value;

        });

    }

});
</script>


<script>
    // Global Dark Mode Synchronizer
    document.addEventListener("DOMContentLoaded", () => {
        const isDarkMode = localStorage.getItem("darkMode") === "true";
        if (isDarkMode) {
            document.body.classList.add("dark-mode");
        }
        
        // Listen for any theme toggle buttons across pages
        const toggles = document.querySelectorAll("#darkModeToggle, .dark-mode-toggle, [onclick*=\x27dark\x27]");
        toggles.forEach(toggle => {
            toggle.addEventListener("click", () => {
                document.body.classList.toggle("dark-mode");
                localStorage.setItem("darkMode", document.body.classList.contains("dark-mode"));
            });
        });
    });
</script>

<script>
    // Universal Dark Mode Handler
    (function() {
        const currentTheme = localStorage.getItem("theme");
        if (currentTheme === "dark" || localStorage.getItem("darkMode") === "true") {
            document.body.classList.add("dark-mode");
        }
        
        // Also sync any dark mode toggle click handlers across pages
        window.addEventListener("load", () => {
            const toggleBtn = document.querySelector("#darkModeToggle, .sun-icon, [onclick*=\x27dark\x27], .dark-toggle");
            if (toggleBtn) {
                toggleBtn.addEventListener("click", () => {
                    document.body.classList.toggle("dark-mode");
                    let isDark = document.body.classList.contains("dark-mode");
                    localStorage.setItem("theme", isDark ? "dark" : "light");
                    localStorage.setItem("darkMode", isDark);
                });
            }
        });
    })();
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const passwordFields = [
        document.getElementById("password"),
        document.getElementById("confirmPassword")
    ];

    const toggles = document.querySelectorAll("[data-password-toggle]");

    let visible = false;

    function updatePasswordVisibility() {

        passwordFields.forEach(function (field) {
            if (field) {
                field.type = visible ? "text" : "password";
            }
        });

        toggles.forEach(function (button) {
            button.textContent = visible ? "🙈" : "👁";
            button.setAttribute(
                "aria-label",
                visible
                    ? "Masquer les mots de passe"
                    : "Afficher les mots de passe"
            );
        });
    }

    toggles.forEach(function (button) {

        button.addEventListener("click", function () {

            visible = !visible;

            updatePasswordVisibility();

        });

    });

});
</script>
