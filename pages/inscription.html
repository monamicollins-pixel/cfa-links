<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>S'inscrire — Collins French Academy</title>
<link rel="stylesheet" href="../css/auth.css">

        <style>
            body.dark-mode {
                background-color: #121212 !important;
                color: #e0e0e0 !important;
            }
            body.dark-mode .card, 
            body.dark-mode .login-container, 
            body.dark-mode .form-container {
                background-color: #1e1e1e !important;
                color: #e0e0e0 !important;
                box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
            }
            body.dark-mode input {
                background-color: #2c2c2c !important;
                color: #ffffff !important;
                border-color: #444 !important;
            }
        </style>
        </head>
<body>
<main class="auth-page">
<div class="auth-card">

<img class="auth-logo" src="../file.png" alt="CFA">

<h1 class="auth-title">Créer votre compte</h1>

<p class="auth-subtitle">
Rejoignez Collins French Academy et commencez votre parcours.
</p>

<div id="authMessage" class="auth-message"></div>

<form class="auth-form" id="signupForm">

<label>
Nom complet
<input id="name" type="text" placeholder="Votre nom" autocomplete="name" required>
</label>

<label>
Adresse e-mail
<input id="email" type="email" placeholder="vous@example.com" autocomplete="email" required>
</label>

<label>
Mot de passe
<input id="password" type="password" placeholder="Minimum 6 caractères" autocomplete="new-password" required>
</label>

<label>
Confirmer le mot de passe
<input id="confirmPassword" type="password" placeholder="Répétez votre mot de passe" autocomplete="new-password" required>
</label>



</form>

<p class="auth-switch">
Vous avez déjà un compte ?
<a href="connexion.html">Se connecter</a>
</p>

<a class="back-home" href="../index.html">
← Retour à l'accueil
</a>

</div>
</main>

<script src="../js/auth.js"></script>

<script>
    // Global Dark Mode Synchronizer
    document.addEventListener("DOMContentLoaded", () => {
        const isDarkMode = localStorage.getItem("darkMode") === "true";
        if (isDarkMode) {
            document.body.classList.add("dark-mode");
        }
        
        // Listen for any theme toggle buttons across pages
        const toggles = document.querySelectorAll("#darkModeToggle, .dark-mode-toggle, [onclick*=\x27dark\x27]");
        toggles.forEach(toggle => {
            toggle.addEventListener("click", () => {
                document.body.classList.toggle("dark-mode");
                localStorage.setItem("darkMode", document.body.classList.contains("dark-mode"));
            });
        });
    });
</script>

<script>
    // Universal Dark Mode Handler
    (function() {
        const currentTheme = localStorage.getItem("theme");
        if (currentTheme === "dark" || localStorage.getItem("darkMode") === "true") {
            document.body.classList.add("dark-mode");
        }
        
        // Also sync any dark mode toggle click handlers across pages
        window.addEventListener("load", () => {
            const toggleBtn = document.querySelector("#darkModeToggle, .sun-icon, [onclick*=\x27dark\x27], .dark-toggle");
            if (toggleBtn) {
                toggleBtn.addEventListener("click", () => {
                    document.body.classList.toggle("dark-mode");
                    let isDark = document.body.classList.contains("dark-mode");
                    localStorage.setItem("theme", isDark ? "dark" : "light");
                    localStorage.setItem("darkMode", isDark);
                });
            }
        });
    })();
</script>
<div style="text-align: center; margin-top: 20px; font-size: 0.9rem; opacity: 0.8;">Apprendre • S'amuser • S'inspirer • Découvrir</div>
</body>
</html>
