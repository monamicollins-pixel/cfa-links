<main class="auth-page">

<h1 class="auth-title">Mot de passe oublié</h1>

<p class="auth-subtitle">
Entrez votre adresse e-mail pour réinitialiser votre mot de passe.
</p>

<div id="authMessage" class="auth-message"></div>

    <form id="resetForm">
        <div style="margin-bottom: 20px; text-align: left;">
            <label for="resetEmail" style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem;">
                Adresse e-mail
            </label>

            <input
                id="resetEmail"
                type="email"
                required
                autocomplete="email"
                placeholder="nom@exemple.com"
                style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;"
            >
        </div>

        <button
            type="submit"
            style="width: 100%; padding: 12px;  border: none; border-radius: 5px; font-weight: bold; cursor: pointer;"

            Envoyer le lien de réinitialisation
        </button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const resetForm = document.getElementById("resetForm");

    if (!resetForm) return;

    resetForm.addEventListener("submit", async function (e) {

        e.preventDefault();

        const email =
            document.getElementById("resetEmail").value
            .trim()
            .toLowerCase();

        const message =
            document.getElementById("authMessage");

        if (!email) {
            if (message) {
                message.textContent =
                    "Veuillez saisir votre adresse e-mail.";
                message.className =
                    "auth-message error";
            }
            return;
        }

        if (message) {
            message.textContent =
                "Envoi du lien de réinitialisation...";
            message.className =
                "auth-message success";
        }

        try {

            const { error } =
                await cfaSupabase.auth.resetPasswordForEmail(
                    email,
                    {
                        redirectTo:
                            new URL(
                                "nouveau-mot-de-passe.html",
                                window.location.href
                            ).href
                    }
                );

            if (error) {
                throw error;
            }

            if (message) {
                message.textContent =
                    "Si cette adresse correspond à un compte CFA, un lien de réinitialisation vient d'être envoyé. Vérifiez votre boîte e-mail.";
                message.className =
                    "auth-message success";
            }

            resetForm.reset();

        } catch (error) {

            console.error(
                "CFA password reset error:",
                error
            );

            if (message) {
                console.error(
                    "CFA password reset error:",
                    error
                );

                let errorMessage =
                    "Impossible d'envoyer le lien. Veuillez réessayer.";

                if (
                    error.message &&
                    error.message.toLowerCase().includes("rate limit")
                ) {
                    errorMessage =
                        "Trop de demandes ont été effectuées récemment. Veuillez patienter quelques minutes avant de demander un nouveau lien.";
                }

                message.textContent = errorMessage;
                message.className =
                    "auth-message error";
            }
        }

    });

});
</script>


<script>
    // Global Dark Mode Synchronizer
    document.addEventListener("DOMContentLoaded", () => {
        const isDarkMode = localStorage.getItem("darkMode") === "true";
        if (isDarkMode) {
            document.body.classList.add("dark-mode");
        }

        // Listen for any theme toggle buttons across pages
        const toggles = document.querySelectorAll("#darkModeToggle, .dark-mode-toggle, [onclick*=\x27dark\x27]");
        toggles.forEach(toggle => {
            toggle.addEventListener("click", () => {
                document.body.classList.toggle("dark-mode");
                localStorage.setItem("darkMode", document.body.classList.contains("dark-mode"));
            });
        });
    });
</script>

<script>
    // Universal Dark Mode Handler
    (function() {
        const currentTheme = localStorage.getItem("theme");
        if (currentTheme === "dark" || localStorage.getItem("darkMode") === "true") {
            document.body.classList.add("dark-mode");
        }

        // Also sync any dark mode toggle click handlers across pages
        window.addEventListener("load", () => {
            const toggleBtn = document.querySelector("#darkModeToggle, .sun-icon, [onclick*=\x27dark\x27], .dark-toggle");
            if (toggleBtn) {
                toggleBtn.addEventListener("click", () => {
                    document.body.classList.toggle("dark-mode");
                    let isDark = document.body.classList.contains("dark-mode");
                    localStorage.setItem("theme", isDark ? "dark" : "light");
                    localStorage.setItem("darkMode", isDark);
                });
            }
        });
    })();
</script>
