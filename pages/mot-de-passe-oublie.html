<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Envoyer le lien — Collins French Academy</title>
<link rel="stylesheet" href="../css/auth.css">

        <style>
            body.dark-mode {
                background-color: #121212 !important;
                color: #e0e0e0 !important;
            }
            body.dark-mode .card, 
            body.dark-mode .login-container, 
            body.dark-mode .form-container {
                background-color: #1e1e1e !important;
                color: #e0e0e0 !important;
                box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
            }
            body.dark-mode input {
                background-color: #2c2c2c !important;
                color: #ffffff !important;
                border-color: #444 !important;
            }
        </style>
        </head>
<body>
<main class="auth-page">
<div class="auth-card">

<img class="auth-logo" src="../file.png" alt="CFA">

<h1 class="auth-title">Mot de passe oublié</h1>

<p class="auth-subtitle">
Entrez votre adresse e-mail pour réinitialiser votre mot de passe.
</p>

<div id="authMessage" class="auth-message"></div>


    <form onsubmit="event.preventDefault(); alert('Un e-mail de réinitialisation a été envoyé !'); window.location.href='connexion.html';">
        <div style="margin-bottom: 20px; text-align: left;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem;">Adresse e-mail</label>
            <input type="email" required placeholder="nom@exemple.com" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        </div>
        <button type="submit" style="width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Envoyer le lien de réinitialisation</button>
    </form>
    <div style="text-align: center; margin-top: 15px;">
        <a href="connexion.html" style="color: #0056b3; text-decoration: underline;">← Retour à la connexion</a>
    </div>
    

<p class="auth-switch">
Vous n'avez pas encore de compte ? <a href="sinscrire.html" style="color: #0056b3; font-weight: bold; text-decoration: underline;">S'inscrire</a>

</p>

<a class="back-home" href="../index.html">
← Retour à l'accueil
</a>

</div>
</main>

<script src="../js/auth.js"></script>

        
<script>
    // Global Dark Mode Synchronizer
    document.addEventListener("DOMContentLoaded", () => {
        const isDarkMode = localStorage.getItem("darkMode") === "true";
        if (isDarkMode) {
            document.body.classList.add("dark-mode");
        }
        
        // Listen for any theme toggle buttons across pages
        const toggles = document.querySelectorAll("#darkModeToggle, .dark-mode-toggle, [onclick*=\x27dark\x27]");
        toggles.forEach(toggle => {
            toggle.addEventListener("click", () => {
                document.body.classList.toggle("dark-mode");
                localStorage.setItem("darkMode", document.body.classList.contains("dark-mode"));
            });
        });
    });
</script>

<script>
    // Universal Dark Mode Handler
    (function() {
        const currentTheme = localStorage.getItem("theme");
        if (currentTheme === "dark" || localStorage.getItem("darkMode") === "true") {
            document.body.classList.add("dark-mode");
        }
        
        // Also sync any dark mode toggle click handlers across pages
        window.addEventListener("load", () => {
            const toggleBtn = document.querySelector("#darkModeToggle, .sun-icon, [onclick*=\x27dark\x27], .dark-toggle");
            if (toggleBtn) {
                toggleBtn.addEventListener("click", () => {
                    document.body.classList.toggle("dark-mode");
                    let isDark = document.body.classList.contains("dark-mode");
                    localStorage.setItem("theme", isDark ? "dark" : "light");
                    localStorage.setItem("darkMode", isDark);
                });
            }
        });
    })();
</script>
