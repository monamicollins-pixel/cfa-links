<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>S'inscrire — Collins French Academy</title>
<link rel="stylesheet" href="../css/auth.css">

        <style>
            body.dark-mode {
                background-color: #121212 !important;
                color: #e0e0e0 !important;
            }
            body.dark-mode .card, 
            body.dark-mode .login-container, 
            body.dark-mode .form-container {
                background-color: #1e1e1e !important;
                color: #e0e0e0 !important;
                box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
            }
            body.dark-mode input {
                background-color: #2c2c2c !important;
                color: #ffffff !important;
                border-color: #444 !important;
            }
        </style>
        </head>
<body>

<div class="mobile-menu-icon-container" style="display: none; padding: 10px 20px 0 20px; background: inherit;">
    <button id="hamburger-menu-trigger" style="background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 5px; display: flex; flex-direction: column; gap: 5px;">
        <span style="display: block; width: 24px; height: 2px; background-color: white;"></span>
        <span style="display: block; width: 24px; height: 2px; background-color: white;"></span>
        <span style="display: block; width: 24px; height: 2px; background-color: white;"></span>
    </button>
</div>
<style>
@media (max-width: 768px) {
    .mobile-menu-icon-container { display: block !important; }
}
</style>




<main class="auth-page">
<div class="auth-card">

<img class="auth-logo" src="../file.png" alt="CFA">

<h1 class="auth-title">Créer un compte</h1>

<p class="auth-subtitle">
Inscrivez-vous pour commencer votre parcours CFA.
</p>

<div id="authMessage" class="auth-message"></div>

<form onsubmit="event.preventDefault(); alert('Inscription réussie !'); window.location.href='connexion.html';" class="auth-form" id="loginForm">

<label>
Adresse e-mail
<input id="email" type="email" placeholder="vous@example.com" autocomplete="email" required>
</label>

<label>
Mot de passe
<input id="password" type="password" placeholder="Votre mot de passe" autocomplete="current-password" required>
</label>

<button class="auth-submit" type="submit" onclick="event.preventDefault(); alert('Inscription réussie !'); window.location.href='connexion.html';">
S'inscrire
</button>

</form>

<p class="auth-switch">
Vous avez déjà un compte ? <a href="connexion.html" style="color: #0056b3; font-weight: bold; text-decoration: underline;">Connexion</a>

</p>

<a class="back-home" href="../index.html">
← Retour à l'accueil
</a>

</div>
</main>

<script src="../js/auth.js"></script>

        
<script>
    // Global Dark Mode Synchronizer
    document.addEventListener("DOMContentLoaded", () => {
        const isDarkMode = localStorage.getItem("darkMode") === "true";
        if (isDarkMode) {
            document.body.classList.add("dark-mode");
        }
        
        // Listen for any theme toggle buttons across pages
        const toggles = document.querySelectorAll("#darkModeToggle, .dark-mode-toggle, [onclick*=\x27dark\x27]");
        toggles.forEach(toggle => {
            toggle.addEventListener("click", () => {
                document.body.classList.toggle("dark-mode");
                localStorage.setItem("darkMode", document.body.classList.contains("dark-mode"));
            });
        });
    });
</script>

<script>
    // Universal Dark Mode Handler
    (function() {
        const currentTheme = localStorage.getItem("theme");
        if (currentTheme === "dark" || localStorage.getItem("darkMode") === "true") {
            document.body.classList.add("dark-mode");
        }
        
        // Also sync any dark mode toggle click handlers across pages
        window.addEventListener("load", () => {
            const toggleBtn = document.querySelector("#darkModeToggle, .sun-icon, [onclick*=\x27dark\x27], .dark-toggle");
            if (toggleBtn) {
                toggleBtn.addEventListener("click", () => {
                    document.body.classList.toggle("dark-mode");
                    let isDark = document.body.classList.contains("dark-mode");
                    localStorage.setItem("theme", isDark ? "dark" : "light");
                    localStorage.setItem("darkMode", isDark);
                });
            }
        });
    })();
</script>
