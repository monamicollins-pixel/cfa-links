<script>
/*
 * CFA — REGISTRATION PASSWORD CONTROLS
 *
 * Explicitly connects each eye button to its
 * corresponding password field.
 */
document.addEventListener("DOMContentLoaded", function () {

    function setupPasswordToggle(buttonId, inputId) {

        const button = document.getElementById(buttonId);
        const input = document.getElementById(inputId);

        if (!button || !input) {
            console.error(
                "CFA password control missing:",
                buttonId,
                inputId
            );
            return;
        }

        button.addEventListener("click", function (event) {

            event.preventDefault();
            event.stopPropagation();

            const showing =
                input.type === "text";

            input.type =
                showing ? "password" : "text";

            button.textContent =
                showing ? "👁️" : "🙈";

            button.setAttribute(
                "aria-label",
                showing
                    ? "Afficher le mot de passe"
                    : "Masquer le mot de passe"
            );

        });
    }

    setupPasswordToggle(
        "togglePassword",
        "password"
    );

    setupPasswordToggle(
        "toggleConfirmPassword",
        "confirmPassword"
    );


    /*
     * Live password confirmation check.
     */

    const password =
        document.getElementById("password");

    const confirmPassword =
        document.getElementById("confirmPassword");

    const form =
        document.getElementById("signupForm");

    if (!password || !confirmPassword || !form) {
        return;
    }

    function passwordsMatch() {

        const p =
            password.value;

        const c =
            confirmPassword.value;

        if (!c) {
            confirmPassword.setCustomValidity("");
            return;
        }

        if (p !== c) {

            confirmPassword.setCustomValidity(
                "Les mots de passe ne correspondent pas."
            );

        } else {

            confirmPassword.setCustomValidity("");

        }
    }

    password.addEventListener(
        "input",
        passwordsMatch
    );

    confirmPassword.addEventListener(
        "input",
        passwordsMatch
    );

    form.addEventListener(
        "submit",
        function () {
            passwordsMatch();
        }
    );

});
</script>



<script>
    // Global Dark Mode Synchronizer
    document.addEventListener("DOMContentLoaded", () => {
        const isDarkMode = localStorage.getItem("darkMode") === "true";
        if (isDarkMode) {
            document.body.classList.add("dark-mode");
        }

        // Listen for any theme toggle buttons across pages
        const toggles = document.querySelectorAll("#darkModeToggle, .dark-mode-toggle, [onclick*=\x27dark\x27]");
        toggles.forEach(toggle => {
            toggle.addEventListener("click", () => {
                document.body.classList.toggle("dark-mode");
                localStorage.setItem("darkMode", document.body.classList.contains("dark-mode"));
            });
        });
    });
</script>

<script>
    // Universal Dark Mode Handler
    (function() {
        const currentTheme = localStorage.getItem("theme");
        if (currentTheme === "dark" || localStorage.getItem("darkMode") === "true") {
            document.body.classList.add("dark-mode");
        }

        // Also sync any dark mode toggle click handlers across pages
        window.addEventListener("load", () => {
            const toggleBtn = document.querySelector("#darkModeToggle, .sun-icon, [onclick*=\x27dark\x27], .dark-toggle");
            if (toggleBtn) {
                toggleBtn.addEventListener("click", () => {
                    document.body.classList.toggle("dark-mode");
                    let isDark = document.body.classList.contains("dark-mode");
                    localStorage.setItem("theme", isDark ? "dark" : "light");
                    localStorage.setItem("darkMode", isDark);
                });
            }
        });
    })();
</script>

<script id="cfa-clean-password-toggle">
(function () {

    function toggle(inputId, button) {

        const input = document.getElementById(inputId);

        if (!input) {
            console.error("CFA password input not found:", inputId);
            return;
        }

        input.type =
            input.type === "password"
                ? "text"
                : "password";

        /* CFA uses the eye icon only */
        button.textContent = "👁️";

    }

    function init() {

        const passwordButton =
            document.getElementById("togglePassword");

        const confirmButton =
            document.getElementById("toggleConfirmPassword");

        if (passwordButton) {

            passwordButton.type = "button";

            passwordButton.onclick = function (event) {

                event.preventDefault();
                event.stopPropagation();

                toggle("password", passwordButton);

                return false;
            };
        }

        if (confirmButton) {

            confirmButton.type = "button";

            confirmButton.onclick = function (event) {

                event.preventDefault();
                event.stopPropagation();

                toggle("confirmPassword", confirmButton);

                return false;
            };
        }

    }

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            init,
            { once: true }
        );
    } else {
        init();
    }

})();
</script>
