<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion - Collins French Academy</title>
<style>
:root{--blue:#174ea6;--ink:#10203a;--muted:#64748b;--paper:#f6f9fc;--white:#fff;--line:#e5eaf2;--shadow:0 20px 40px -15px rgba(15,35,70,.12);--error:#d93025;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:var(--white);border:1px solid var(--line);border-radius:24px;padding:40px;width:100%;max-width:420px;box-shadow:var(--shadow);}
h1{font-size:24px;margin-bottom:8px;color:var(--blue);text-align:center;}
p{color:var(--muted);font-size:14px;margin-bottom:24px;text-align:center;}
.form-group{margin-bottom:16px;}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--paper);color:var(--ink);}
input:focus{outline:none;border-color:var(--blue);}
.btn{width:100%;padding:12px;border-radius:8px;font-weight:700;font-size:14px;background:var(--blue);color:white;border:none;cursor:pointer;margin-top:10px;}
.footer-text{text-align:center;margin-top:20px;font-size:13px;color:var(--muted);}
.footer-text a{color:var(--blue);text-decoration:none;font-weight:600;}
</style>
</head>
<body>

<div class="mobile-menu-bar" style="display: none; padding: 10px 20px; background: inherit;">
    <button id="site-menu-btn" style="background: #1e293b; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 14px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 500;">
        <span>☰ Menu</span>
    </button>
</div>
<style>
@media (max-width: 768px) {
    .mobile-menu-bar { display: block !important; }
}
</style>

<div class="card">
  <h1>Espace CFA</h1>
  <p>Connectez-vous pour accéder au centre de création</p>
  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>Adresse Email</label>
      <input type="email" id="email" placeholder="votre@email.com" required>
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn">Se connecter</button>
  </form>
  <div class="footer-text">
    <a href="index.html">← Retour à l'accueil</a>
  </div>
</div>
<script>
function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value;
  // Set session flags explicitly and use absolute or relative path securely
  sessionStorage.setItem('cfa_logged_in', 'true');
  sessionStorage.setItem('cfa_user', email);
  window.location.replace('dashboard.html');
}
</script>

<script>
    // Global Dark Mode Synchronizer
    document.addEventListener("DOMContentLoaded", () => {
        const isDarkMode = localStorage.getItem("darkMode") === "true";
        if (isDarkMode) {
            document.body.classList.add("dark-mode");
        }
        
        // Listen for any theme toggle buttons across pages
        const toggles = document.querySelectorAll("#darkModeToggle, .dark-mode-toggle, [onclick*=\x27dark\x27]");
        toggles.forEach(toggle => {
            toggle.addEventListener("click", () => {
                document.body.classList.toggle("dark-mode");
                localStorage.setItem("darkMode", document.body.classList.contains("dark-mode"));
            });
        });
    });
</script>
<div style="text-align: center; margin-top: 20px; font-size: 0.9rem; opacity: 0.8;">Apprendre • S'amuser • S'inspirer • Découvrir</div>

<!-- Mobile Navigation Drawer -->
<div id="mobile-menu-drawer" style="display: none; position: fixed; top: 0; right: 0; width: 280px; height: 100%; background: #0f172a; z-index: 9999; box-shadow: -4px 0 20px rgba(0,0,0,0.5); flex-direction: column; padding: 25px; box-sizing: border-box; color: #fff; font-family: inherit;">
    <div style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
        <button id="close-menu-btn" style="background: none; border: none; color: #fff; font-size: 24px; cursor: pointer;">&times;</button>
    </div>
    <div id="theme-toggle-btn" style="cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 16px; margin-bottom: 15px;">☀️ Mode clair / sombre</div>
    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin: 5px 0 15px 0;">
    <a href="index.html" style="color: inherit; text-decoration: none; font-size: 16px; margin-bottom: 15px; display: block;">Accueil</a>
    <a href="index.html#cours" style="color: inherit; text-decoration: none; font-size: 16px; margin-bottom: 15px; display: block;">Cours</a>
    <a href="pages/apropos.html" style="color: inherit; text-decoration: none; font-size: 16px; margin-bottom: 20px; display: block;">À propos</a>
    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin: 0 0 20px 0;">
    <a href="pages/connexion.html" style="background: #2563eb; color: white; padding: 12px; border-radius: 8px; text-align: center; text-decoration: none; font-weight: 600; display: block;">Connexion</a>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const hamburger = document.querySelector(".menu-toggle, .hamburger, header .fa-bars, button svg, [class*="menu"], [class*="toggle"], header button:last-child");
    const drawer = document.getElementById("mobile-menu-drawer");
    const closeBtn = document.getElementById("close-menu-btn");
    
    if (hamburger && drawer) {
        hamburger.style.cursor = "pointer";
        hamburger.addEventListener("click", (e) => {
            e.stopPropagation();
            drawer.style.display = "flex";
        });
    }
    if (closeBtn && drawer) {
        closeBtn.addEventListener("click", () => {
            drawer.style.display = "none";
        });
    }
    window.addEventListener("click", (e) => {
        if (drawer && drawer.style.display === "flex" && !drawer.contains(e.target) && !hamburger.contains(e.target)) {
            drawer.style.display = "none";
        }
    });
});
</script>

</body>
</html>
