<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>CFA header inspector</title>
<style>body{font:14px/1.4 system-ui,sans-serif;margin:20px;max-width:1000px}button{font:inherit;padding:8px 14px;margin-right:8px}
pre{background:#f3f4f6;padding:12px;border-radius:8px;white-space:pre-wrap;max-height:60vh;overflow:auto}</style></head><body>
<h1>CFA header inspector</h1>
<p>Loads every page at PC and phone width, in light and dark, and compares the header with index.html.</p>
<button id="go">Run inspection</button><button id="copy" disabled>Copy report</button> <span id="prog"></span>
<pre id="out">Waiting...</pre>
<script>
const PAGES = ["index.html", "admin/index.html", "admin/lesson-editor.html", "admin/lessons.html", "cours-a1.html", "dashboard.html", "login.html", "pages/apropos.html", "pages/choix-espace.html", "pages/communaute.html", "pages/compas.html", "pages/connexion.html", "pages/cours.html", "pages/espace-etudiant.html", "pages/inscription.html", "pages/ma-progression.html", "pages/mes-cours.html", "pages/mot-de-passe-oublie.html", "pages/nouveau-mot-de-passe.html", "pages/sinscrire.html", "pages/suggestions.html", "register.html"];
const VIEWS = [['PC',1280,800],['Phone',390,800]];
const THEMES = ['light','dark'];
const SHARED_CSS = ['cfa-header.css','cfa-header-base.css','cfa-buttons.css'];
const SHARED_JS = ['cfa-nav-dropdown.js','cfa-current-page.js','cfa-shared-theme.js'];
const KEYS = ['hasHeader','headerH','pos','logo','nameVis','nameSize','nameWeight','btnH','btnBg','btnColor','btnSize','btnRadius','visibleCount','themeBtnHidden','hOverflow','headerBg'];
const wait = ms => new Promise(r => setTimeout(r, ms));

function measure(win){
  const d = win.document, g = (e,p) => e ? win.getComputedStyle(e)[p] : null, r = e => e ? e.getBoundingClientRect() : null;
  const hd = d.querySelector('header'), name = d.querySelector('header .brand span');
  const logo = d.querySelector('header .logo-container img') || d.querySelector('header img');
  const btn = d.getElementById('cfa-navdd-btn'), th = d.getElementById('themeToggle');
  const vis = [...d.querySelectorAll('header a, header button')].filter(e => e.offsetParent !== null && !e.closest('#cfa-navdd-panel'));
  const hr = r(hd), lr = r(logo), br = r(btn);
  return {
    loc: win.location.pathname, hasHeader: !!hd,
    headerH: hr ? Math.round(hr.height) : null, headerBg: g(hd,'backgroundColor'), pos: g(hd,'position'),
    logo: lr ? Math.round(lr.width)+'x'+Math.round(lr.height) : null,
    nameVis: !!(name && name.offsetParent !== null), nameSize: g(name,'fontSize'), nameWeight: g(name,'fontWeight'),
    btnH: br ? Math.round(br.height) : null, btnBg: g(btn,'backgroundColor'), btnColor: g(btn,'color'),
    btnSize: g(btn,'fontSize'), btnRadius: g(btn,'borderTopLeftRadius'),
    visibleCount: vis.length, visible: vis.map(e => (e.textContent.trim() || e.getAttribute('aria-label') || e.tagName).slice(0,22)).join(' | '),
    themeBtnHidden: !th || th.offsetParent === null,
    hOverflow: d.documentElement.scrollWidth > d.documentElement.clientWidth + 1,
    css: [...d.querySelectorAll('link[rel=stylesheet]')].map(l => (l.getAttribute('href')||'').split('?')[0].split('/').pop()),
    js: [...d.querySelectorAll('script[src]')].map(s => (s.getAttribute('src')||'').split('?')[0].split('/').pop())
  };
}
function setTheme(win, th){ const d = win.document; d.documentElement.setAttribute('data-theme', th); d.body.classList.toggle('dark-mode', th === 'dark'); }
async function load(url, w, h){
  const f = document.createElement('iframe');
  f.style.cssText = 'position:absolute;left:-10000px;top:0;border:0;width:'+w+'px;height:'+h+'px';
  document.body.appendChild(f);
  await new Promise(res => { f.onload = res; f.src = url; });
  await wait(1800);
  return f;
}
function diff(a, b){
  const out = [];
  for (const k of KEYS){
    const x = a[k], y = b[k];
    const same = (typeof x === 'number' && typeof y === 'number') ? Math.abs(x - y) <= 2 : x === y;
    if (!same) out.push(k + ' ' + x + ' (ref ' + y + ')');
  }
  return out;
}
let REPORT = '';
$ = id => document.getElementById(id);
$('go').onclick = async () => {
  $('go').disabled = true; $('out').textContent = 'Running...';
  const res = {}; let n = 0; const total = PAGES.length * VIEWS.length;
  for (const url of PAGES) for (const [vn,w,h] of VIEWS){
    $('prog').textContent = (++n) + ' / ' + total + '  ' + url + ' ' + vn;
    let f = null;
    try {
      f = await load(url, w, h);
      for (const th of THEMES){ setTheme(f.contentWindow, th); await wait(700); res[url+'|'+vn+'|'+th] = measure(f.contentWindow); }
    } catch (e) { for (const th of THEMES) res[url+'|'+vn+'|'+th] = { error: String(e) }; }
    if (f) f.remove();
  }
  const ref = PAGES[0], lines = ['== SUMMARY (reference: ' + ref + ') ==', ''], details = [];
  for (const url of PAGES){
    const bad = [];
    for (const [vn] of VIEWS) for (const th of THEMES){
      const k = url+'|'+vn+'|'+th, a = res[k], b = res[ref+'|'+vn+'|'+th];
      if (a.error) { bad.push(vn+'/'+th+': ERROR '+a.error); continue; }
      if (url === ref) continue;
      if (!url.endsWith(a.loc.replace(/^\//,''))) bad.push(vn+'/'+th+': page redirected to '+a.loc);
      const d = diff(a, b);
      if (d.length) bad.push(vn+'/'+th+': '+d.join('; '));
    }
    const a0 = res[url+'|PC|light'] || {}, miss = [];
    if (url !== ref && a0.css){
      SHARED_CSS.forEach(f => { if (!a0.css.includes(f)) miss.push(f); });
      SHARED_JS.forEach(f => { if (!a0.js.includes(f)) miss.push(f); });
    }
    if (miss.length) bad.push('missing files: ' + miss.join(', '));
    lines.push(url + (url === ref ? '  (reference)' : bad.length ? '  DIFF' : '  OK'));
    if (bad.length) details.push(url, ...bad.map(x => '   ' + x), '');
  }
  const r = res[ref+'|PC|light'];
  REPORT = lines.join('\n') + '\n\n== DETAILS ==\n' + (details.join('\n') || 'none') +
    '\n\n== REFERENCE ' + ref + ' (PC, light) ==\n' + JSON.stringify(r, null, 1);
  $('out').textContent = REPORT; $('copy').disabled = false; $('go').disabled = false; $('prog').textContent = 'done';
};
/* autorun */ setTimeout(function(){ $('go').click(); }, 600);
$('copy').onclick = () => navigator.clipboard.writeText(REPORT).then(() => { $('copy').textContent = 'Copied'; });
</script></body></html>
