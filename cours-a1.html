<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cours A1 — Collins French Academy</title>
<style>
:root{--blue:#174ea6;--ink:#10203a;--muted:#64748b;--paper:#f6f9fc;--line:#e5eaf2}
body{font-family:Inter,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6;margin:0;padding:40px 20px}
.container{max-width:800px;margin:auto;background:white;padding:40px;border-radius:24px;border:1px solid var(--line)}
h1{color:var(--blue);margin-bottom:10px}
p{color:var(--muted);margin-bottom:20px}
a{color:var(--blue);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="container">
  <a href="index.html">← Retour à l'accueil</a>
  <h1>Niveau A1 · Découverte</h1>
  <p>Bienvenue dans votre espace de cours A1. Les leçons et exercices pratiques seront bientôt disponibles ici.</p>
</div>

<script>
    // Global Dark Mode Synchronizer
    document.addEventListener("DOMContentLoaded", () => {
        const isDarkMode = localStorage.getItem("darkMode") === "true";
        if (isDarkMode) {
            document.body.classList.add("dark-mode");
        }
        
        // Listen for any theme toggle buttons across pages
        const toggles = document.querySelectorAll("#darkModeToggle, .dark-mode-toggle, [onclick*=\x27dark\x27]");
        toggles.forEach(toggle => {
            toggle.addEventListener("click", () => {
                document.body.classList.toggle("dark-mode");
                localStorage.setItem("darkMode", document.body.classList.contains("dark-mode"));
            });
        });
    });
</script>
</body>
</html>
