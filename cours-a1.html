<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cours A1 — Collins French Academy</title>
<style>
:root{--blue:#174ea6;--ink:#10203a;--muted:#64748b;--paper:#f6f9fc;--line:#e5eaf2}
body{font-family:Inter,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6;margin:0;padding:40px 20px}
.container{max-width:800px;margin:auto;background:white;padding:40px;border-radius:24px;border:1px solid var(--line)}
h1{color:var(--blue);margin-bottom:10px}
p{color:var(--muted);margin-bottom:20px}
a{color:var(--blue);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="container">
  <a href="index.html">← Retour à l'accueil</a>
  <h1>Niveau A1 · Découverte</h1>
  <p>Bienvenue dans votre espace de cours A1. Les leçons et exercices pratiques seront bientôt disponibles ici.</p>
</div>

<script>
    // Global Dark Mode Synchronizer
    document.addEventListener("DOMContentLoaded", () => {
        const isDarkMode = localStorage.getItem("darkMode") === "true";
        if (isDarkMode) {
            document.body.classList.add("dark-mode");
        }
        
        // Listen for any theme toggle buttons across pages
        const toggles = document.querySelectorAll("#darkModeToggle, .dark-mode-toggle, [onclick*=\x27dark\x27]");
        toggles.forEach(toggle => {
            toggle.addEventListener("click", () => {
                document.body.classList.toggle("dark-mode");
                localStorage.setItem("darkMode", document.body.classList.contains("dark-mode"));
            });
        });
    });
</script>
<div style="text-align: center; margin-top: 20px; font-size: 0.9rem; opacity: 0.8;">Apprendre • S'amuser • S'inspirer • Découvrir</div>

<!-- Mobile Navigation Drawer -->
<div id="mobile-menu-drawer" style="display: none; position: fixed; top: 0; right: 0; width: 280px; height: 100%; background: #0f172a; z-index: 9999; box-shadow: -4px 0 20px rgba(0,0,0,0.5); flex-direction: column; padding: 25px; box-sizing: border-box; color: #fff; font-family: inherit;">
    <div style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
        <button id="close-menu-btn" style="background: none; border: none; color: #fff; font-size: 24px; cursor: pointer;">&times;</button>
    </div>
    <div id="theme-toggle-btn" style="cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 16px; margin-bottom: 15px;">☀️ Mode clair / sombre</div>
    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin: 5px 0 15px 0;">
    <a href="index.html" style="color: inherit; text-decoration: none; font-size: 16px; margin-bottom: 15px; display: block;">Accueil</a>
    <a href="index.html#cours" style="color: inherit; text-decoration: none; font-size: 16px; margin-bottom: 15px; display: block;">Cours</a>
    <a href="pages/apropos.html" style="color: inherit; text-decoration: none; font-size: 16px; margin-bottom: 20px; display: block;">À propos</a>
    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin: 0 0 20px 0;">
    <a href="pages/connexion.html" style="background: #2563eb; color: white; padding: 12px; border-radius: 8px; text-align: center; text-decoration: none; font-weight: 600; display: block;">Connexion</a>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const hamburger = document.querySelector(".menu-toggle, .hamburger, header .fa-bars, button svg, [class*="menu"], [class*="toggle"], header button:last-child");
    const drawer = document.getElementById("mobile-menu-drawer");
    const closeBtn = document.getElementById("close-menu-btn");
    
    if (hamburger && drawer) {
        hamburger.style.cursor = "pointer";
        hamburger.addEventListener("click", (e) => {
            e.stopPropagation();
            drawer.style.display = "flex";
        });
    }
    if (closeBtn && drawer) {
        closeBtn.addEventListener("click", () => {
            drawer.style.display = "none";
        });
    }
    window.addEventListener("click", (e) => {
        if (drawer && drawer.style.display === "flex" && !drawer.contains(e.target) && !hamburger.contains(e.target)) {
            drawer.style.display = "none";
        }
    });
});
</script>

</body>
</html>
