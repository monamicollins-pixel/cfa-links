<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collins French Academy</title>
<style>
:root{--blue:#174ea6;--ink:#10203a;--muted:#64748b;--paper:#f6f9fc;--white:#fff;--line:#e5eaf2;--shadow:0 20px 40px -15px rgba(15,35,70,.12);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.hero{background:var(--white);border:1px solid var(--line);border-radius:24px;padding:50px;width:100%;max-width:500px;text-align:center;box-shadow:var(--shadow);}
h1{font-size:28px;margin-bottom:12px;color:var(--blue)}
p{color:var(--muted);font-size:15px;margin-bottom:30px}
.btn-group{display:flex;gap:15px;justify-content:center;}
.btn{padding:12px 24px;border-radius:10px;font-weight:800;font-size:14px;text-decoration:none;cursor:pointer;}
.btn-primary{background:var(--blue);color:white;}
.btn-secondary{background:var(--paper);color:var(--ink);border:1px solid var(--line);}
</style>
</head>
<body>
<div class="hero">
  <h1>Collins French Academy</h1>
  <p>Votre plateforme d'apprentissage du français.</p>
  <div class="btn-group">
    <a href="login.html" class="btn btn-primary">Se connecter</a>
    <a href="register.html" class="btn btn-secondary">S'inscrire</a>
  </div>
</div>
</body>
</html>
