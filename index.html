<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collins French Academy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }
    .logo-container {
      width: 130px;
      height: 130px;
      margin: 0 auto 25px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #e0e0e0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .logo-container img { width: 100%; height: 100%; object-fit: cover; }
    .link-card {
      display: flex;
      align-items: center;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 30px;
      padding: 12px 20px;
      margin-bottom: 15px;
      text-decoration: none;
      color: #1a1a1a;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }
    .link-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 12px rgba(0,0,0,0.08);
      background: #ffffff;
    }
    .icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
      font-size: 12px;
      color: white;
      font-weight: bold;
      flex-shrink: 0;
    }
    .whatsapp { background-color: #25D366; }
    .tiktok { background-color: #000000; }
    .youtube { background-color: #FF0000; }
    .instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .cfa-icon { background-color: #002395; }
    .link-text { flex-grow: 1; text-align: left; }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-container">
      <img src="logo.jpg" alt="Collins French Academy Logo">
    </div>

    <a href="https://whatsapp.com/channel/0029VbCsnvZEAKWIGVzLE12t" target="_blank" class="link-card">
      <div class="icon whatsapp">WA</div>
      <span class="link-text">WhatsApp Chat</span>
    </a>

    <a href="+254 759 583038" target="_blank" class="link-card">
      <div class="icon tiktok">TT</div>
      <span class="link-text">TikTok</span>
    </a>

    <a href="https://chat.whatsapp.com/C5viQ4lgsNiF3tyRRovWMq" target="_blank" class="link-card">
      <div class="icon youtube">YT</div>
      <span class="link-text">YouTube</span>
    </a>

    <a href="https://chat.whatsapp.com/C5viQ4lgsNiF3tyRRovWMq" target="_blank" class="link-card">
      <div class="icon instagram">IG</div>
      <span class="link-text">Instagram</span>
    </a>

    <a href="#"https://chat.whatsapp.com/C5viQ4lgsNiF3tyRRovWMq"_blank" class="link-card">
      <div class="icon cfa-icon">CFA</div>
      <span class="link-text">CFA Class Schedule</span>
    </a>

    <a href="#" https://chat.whatsapp.com/C5viQ4lgsNiF3tyRRovWMq"_blank" class="link-card">
      <div class="icon cfa-icon">CFA</div>
      <span class="link-text">Register for a Course</span>
    </a>
  </div>

</body>
</html>
